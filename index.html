<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto — Empresa Ficticia</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 560px;">
<h1 class="mb-1">Dejanos tu consulta</h1>
<p class="text-muted mb-4">
Te respondemos a la brevedad por email o WhatsApp.
</p>
<form id="formulario" class="card p-4 shadow-sm">
<div class="mb-3">
<label for="nombre" class="form-label">
Nombre y apellido
</label>
<input
id="nombre"
class="form-control"
required>
</div>
<div class="mb-3">
<label for="email" class="form-label">
Email
</label>
<input
id="email"
type="email"
class="form-control"
required>
</div>
<div class="mb-3">
<label for="telefono" class="form-label">
  Teléfono
</label>
<input
id="telefono"
class="form-control"
required>
</div>
<div class="mb-3">
<label for="mensaje" class="form-label">
Mensaje
</label>
<textarea
id="mensaje"
class="form-control"
rows="3"
required></textarea>
</div>
<button
type="submit"
id="boton"
class="btn btn-primary w-100">
Enviar consulta
</button>
<p
id="estado"
class="text-center mt-3 mb-0">
</p>
</form>
</main>
<script>
// REEMPLAZAR por la URL del Web App (termina en /exec)
var URL_BACKEND = "https://script.google.com/macros/s/AKfycbwX2B3KBX35xt1XMT2270bGuR9FWODsctiOjejQ3uH0bxY8YnJ7Nq4P_XD5uZy6TEye/exec";
document.getElementById("formulario").addEventListener(
"submit",
function (evento) {
  evento.preventDefault();
var datos = {
nombre:
document.getElementById("nombre").value,
email:
document.getElementById("email").value,
telefono:
document.getElementById("telefono").value,
mensaje:
document.getElementById("mensaje").value
};
var boton =
document.getElementById("boton");
var estado =
document.getElementById("estado");
boton.disabled = true;
boton.textContent = "Enviando...";
fetch(URL_BACKEND, {
method: "POST",
// Envía los datos al backend como texto en formato JSON
headers: {
"Content-Type": "text/plain;charset=utf-8"
},
body: JSON.stringify(datos)
})
.then(function (respuesta) {
return respuesta.json();
})
.then(function (resultado) {
  estado.textContent =
"¡Gracias! Tu consulta fue registrada.";
estado.className =
"text-center mt-3 mb-0 text-success";
document.getElementById("formulario").reset();
})
.catch(function (error) {
estado.textContent =
"Hubo un error. Intentá de nuevo.";
estado.className =
"text-center mt-3 mb-0 text-danger";
})
.finally(function () {
boton.disabled = false;
boton.textContent = "Enviar consulta";
});
});
</script>
</body>
</html>
