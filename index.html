<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto — Empresa Ficticia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 560px;">
    <div class="card p-4 shadow-sm border-0 rounded-4">
      <h1 class="h3 mb-1 text-dark fw-bold">Dejanos tu consulta</h1>
      <p class="text-muted small mb-4">
        Te responderemos a la brevedad y recibirás una confirmación en tu correo.
      </p>

      <form id="formulario">
        <div class="mb-3">
          <label for="nombre" class="form-label small fw-semibold">Nombre y apellido</label>
          <input id="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Email (recibirás la confirmación aquí)</label>
          <input id="email" type="email" class="form-control" placeholder="nombre@correo.com" required>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label small fw-semibold">Teléfono</label>
          <input id="telefono" type="tel" class="form-control" placeholder="+54 9 11 1234-5678" required>
        </div>

        <div class="mb-3">
          <label for="mensaje" class="form-label small fw-semibold">Mensaje</label>
          <textarea id="mensaje" class="form-control" rows="3" placeholder="Escribe tu consulta..." required></textarea>
        </div>

        <button type="submit" id="boton" class="btn btn-primary w-100 py-2 fw-semibold">
          Enviar consulta
        </button>

        <!-- Contenedor de aviso de estado -->
        <div id="estado" class="mt-3 text-center" style="display: none;"></div>
      </form>
    </div>
  </main>

  <script>
    // URL de tu Web App en Google Apps Script (terminada en /exec)
    var URL_BACKEND = "https://script.google.com/macros/s/AKfycbxVDtdBP0xH7BbfB3Z1c9iyl6C1OFy2ny784sIbnqrIhrSvcLyESdlxhfv2FzioX4VN/exec";

    document.getElementById("formulario").addEventListener("submit", function (evento) {
      evento.preventDefault();

      var boton = document.getElementById("boton");
      var estado = document.getElementById("estado");

      // 1. Limpieza de datos (elimina espacios invisibles al inicio o final)
      var datos = {
        nombre: document.getElementById("nombre").value.trim(),
        email: document.getElementById("email").value.trim().toLowerCase(),
        telefono: document.getElementById("telefono").value.trim(),
        mensaje: document.getElementById("mensaje").value.trim()
      };

      // 2. Estado visual de envío con spinner
      boton.disabled = true;
      boton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Enviando consulta...';
      estado.style.display = "none";

      // 3. Envío al backend
      fetch(URL_BACKEND, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(datos)
      })
      .then(function (respuesta) {
        return respuesta.text();
      })
      .then(function (textoRespuesta) {
        // Validación de respuesta segura (evita errores con redirecciones de Google)
        estado.style.display = "block";
        estado.className = "mt-3 p-3 rounded alert alert-success text-center";
        estado.innerHTML = "<strong>¡Consulta registrada con éxito!</strong><br><small class='text-dark'>Enviamos una confirmación a <strong>" + datos.email + "</strong> (si no la ves, revisa tu carpeta de Spam).</small>";
        document.getElementById("formulario").reset();
      })
      .catch(function (error) {
        estado.style.display = "block";
        estado.className = "mt-3 p-3 rounded alert alert-danger text-center";
        estado.innerHTML = "Hubo un error al conectar con el servidor. Intentá de nuevo.";
      })
      .finally(function () {
        boton.disabled = false;
        boton.textContent = "Enviar consulta";
      });
    });
  </script>
</body>
</html>
